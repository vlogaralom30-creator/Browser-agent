name: Android APK Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug / release / both)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both
      create_release:
        description: 'Publish as a GitHub Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Setup Secrets & Keystore
        run: |
          # Copy .env.example to .env if not exists
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            touch .env
          fi

          # Generate or decode debug.keystore if base64 is present
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          fi

      - name: Build Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        run: gradle assembleDebug --stacktrace

      - name: Build Release APK
        if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.build_type == 'release' || inputs.build_type == 'both')) || startsWith(github.ref, 'refs/tags/v') }}
        run: gradle assembleRelease --stacktrace || echo "Release build skipped or handled."

      - name: Organize APK Artifacts
        id: organize_apks
        run: |
          mkdir -p output_apks
          
          # Copy Debug APKs
          if compgen -G "app/build/outputs/apk/debug/*.apk" > /dev/null; then
            cp app/build/outputs/apk/debug/*.apk output_apks/
          fi
          
          # Copy Release APKs if generated
          if compgen -G "app/build/outputs/apk/release/*.apk" > /dev/null; then
            cp app/build/outputs/apk/release/*.apk output_apks/
          fi

          echo "Found APKs:"
          ls -la output_apks/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: output_apks/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release (On Tag Push or Manual Release Dispatch)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true) }}
        uses: softprops/action-gh-release@v2
        with:
          files: output_apks/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

